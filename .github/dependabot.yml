version: 2
updates:
  # The package itself.
  - package-ecosystem: "pub"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"

  # The example app (its own pubspec, own dependency set).
  - package-ecosystem: "pub"
    directory: "/example"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps-example)"
    labels:
      - "dependencies"
      - "example"

  # GitHub Actions workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "ci"
