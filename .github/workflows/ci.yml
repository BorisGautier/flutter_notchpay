name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable

jobs:
  analyze-and-test:
    name: Analyze & test (package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Verify pub.dev package quality (dry run)
        run: dart pub publish --dry-run

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  example:
    name: Analyze & test (example app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install package dependencies
        run: flutter pub get

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Generate local database code
        working-directory: example
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        working-directory: example
        run: flutter analyze --fatal-infos

      - name: Test
        working-directory: example
        run: flutter test

  integration-test:
    name: Integration test (Android emulator)
    runs-on: ubuntu-latest
    # Emulator boots can be flaky in CI; this job is informational and does
    # not block merges. See CONTRIBUTING.md for how to run it locally on a
    # real device instead.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install package dependencies
        run: flutter pub get

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Generate example code
        working-directory: example
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: cd example && flutter test ../integration_test/notchpay_checkout_flow_test.dart

  security-and-secret-scan:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for committed NotchPay secret keys
        run: |
          # A defense-in-depth check on top of GitHub's own secret scanning:
          # fail the build if a NotchPay *secret* key literal (sk.xxx / sk_xxx,
          # not the safe-to-share public pk.xxx / pk_xxx) shows up anywhere
          # in tracked files.
          if git grep -nEI '\b[sS][kK][._][A-Za-z0-9]{16,}' -- . ':(exclude)**/*.lock'; then
            echo "::error::Found what looks like a committed NotchPay secret key (sk_...). Remove it and rotate the key immediately."
            exit 1
          fi
          echo "✅ No secret-looking NotchPay key literals found."

      - name: Scan for private key certificates or RSA tokens
        run: |
          if git grep -nEI '-----BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY-----' -- . ; then
            echo "::error::Found a committed private RSA/SSH key certificate. Remove it immediately."
            exit 1
          fi
          echo "✅ No private SSH/RSA key certificates found."

      - name: Scan for hardcoded cloud & git credentials
        run: |
          if git grep -nEI '(ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9]{22}_[A-Za-z0-9]{59}|AKIA[0-9A-Z]{16})' -- . ; then
            echo "::error::Found hardcoded GitHub Personal Access Token or AWS Access Key."
            exit 1
          fi
          echo "✅ No hardcoded cloud or git tokens found."
