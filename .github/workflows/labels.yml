name: Sync labels

# Keeps the repository's labels in sync with .github/labels.yml ("labels as
# code"). Edit that file and merge to `main` to create/update/rename
# labels — do not edit labels by hand in the GitHub UI, changes there are
# overwritten on the next sync.
on:
  push:
    branches: [main]
    paths:
      - ".github/labels.yml"
      - ".github/workflows/labels.yml"
  workflow_dispatch:

jobs:
  sync:
    name: Sync labels
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: EndBug/label-sync@v2
        with:
          config-file: .github/labels.yml
          delete-other-labels: false
